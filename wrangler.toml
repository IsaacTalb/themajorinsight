name = "themajorinsight-worker"
main = "src/worker/index.ts"
compatibility_date = "2026-09-07"
workers_dev = true

[vars]
APP_NAME = "The Major Insight"

[[d1_databases]]
binding = "DB"
database_name = "themajorinsight"
database_id = "${D1_DATABASE_ID}"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "themajorinsight-media"
